name: Test image

on:
  push:
    branches: [test/matrix-approvals-v0.8.7]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - id: build
        uses: docker/build-push-action@1dc73863535b631f98b2378be8619f83b136f4a0 # v6.18.0
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          push: true
          build-args: ZEROCLAW_BUILD_ID=${{ github.sha }}
          tags: ghcr.io/${{ github.repository }}:matrix-approvals-test
      - run: echo "digest=${{ steps.build.outputs.digest }}"
